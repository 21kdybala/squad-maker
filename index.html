<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="11·10·9인제 축구 포메이션과 라인업을 만들고 이미지로 저장하는 스쿼드 메이커" />
  <meta name="theme-color" content="#3d195b" />
  <title>축구 스쿼드 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="styles.css?v=20260601-mobile-line" />
</head>
<body class="theme-pl">
  <div class="app">
    <header class="header">
      <button type="button" class="header__home" id="brandHome" aria-label="첫 번째 단계로 이동">
        <div class="header__brand">
          <p class="header__kicker">Football Squad Maker</p>
          <h1 class="header__main">축구 스쿼드 메이커</h1>
          <div class="header__rule" aria-hidden="true"></div>
        </div>
      </button>
    </header>

    <nav class="steps" aria-label="진행 단계">
      <button type="button" class="steps__item is-active" data-step-indicator="1" aria-label="1단계: 경기 인원">
        <span class="steps__num" aria-hidden="true">1</span>
        <span class="steps__label">경기 인원</span>
      </button>
      <div class="steps__line" aria-hidden="true"></div>
      <button type="button" class="steps__item" data-step-indicator="2" aria-label="2단계: 포메이션" disabled>
        <span class="steps__num" aria-hidden="true">2</span>
        <span class="steps__label">포메이션</span>
      </button>
      <div class="steps__line" aria-hidden="true"></div>
      <button type="button" class="steps__item" data-step-indicator="3" aria-label="3단계: 라인업" disabled>
        <span class="steps__num" aria-hidden="true">3</span>
        <span class="steps__label">라인업</span>
      </button>
    </nav>

    <main>
      <!-- Step 1 -->
      <section class="step-panel is-active" id="step1" aria-labelledby="step1-title">
        <h2 id="step1-title" class="panel-title">몇 대 몇 경기인가요?</h2>
        <div class="choice-grid choice-grid--step1" role="group" aria-label="경기 인원">
          <button type="button" class="choice-card" data-match="11">
            <span class="choice-card__main">11 vs 11</span>
          </button>
          <button type="button" class="choice-card" data-match="10">
            <span class="choice-card__main">10 vs 10</span>
          </button>
          <button type="button" class="choice-card" data-match="9">
            <span class="choice-card__main">9 vs 9</span>
          </button>
        </div>
        <div class="nav-row">
          <span></span>
          <button type="button" class="btn btn--primary" id="btnStep1Next" disabled>다음</button>
        </div>
      </section>

      <!-- Step 2 -->
      <section class="step-panel" id="step2" hidden aria-labelledby="step2-title">
        <h2 id="step2-title" class="panel-title">포메이션은 무엇인가요?</h2>
        <p class="panel-desc" id="step2Summary"></p>
        <p class="hint" id="step2Legend" hidden>★ 표시: 인기 포메이션</p>
        <div class="formation-grid" id="formationGrid" role="listbox" aria-label="포메이션 목록"></div>
        <div class="nav-row">
          <button type="button" class="btn btn--ghost" id="btnStep2Back">이전</button>
          <button type="button" class="btn btn--primary" id="btnStep2Next" disabled>다음</button>
        </div>
      </section>

      <!-- Step 3 -->
      <section class="step-panel" id="step3" hidden aria-labelledby="step3-title">
        <h2 id="step3-title" class="panel-title">라인업은 어떻게 되나요?</h2>

        <div class="capture-wrap">
          <div class="capture" id="capture">
            <div class="capture__head">
              <p class="capture__badge" id="captureBadge"></p>
              <p class="capture__fm" id="captureFormation"></p>
            </div>
            <div class="capture-lineup">
              <div class="pitch-column">
                <div class="pitch-wrap pitch-wrap--wide">
                  <div class="pitch" id="pitch" aria-hidden="true"></div>
                </div>
              </div>
              <aside class="subs subs--side" aria-label="교체 명단">
                <div class="subs__head">
                  <span>SUB · 5명</span>
                </div>
                <div class="subs__list" id="subsList"></div>
              </aside>
            </div>
          </div>
        </div>

        <div class="export-row">
          <label class="field field--compact">
            <span>파일 형식</span>
            <select id="exportFormat">
              <option value="png">PNG (선명)</option>
              <option value="jpeg">JPEG (용량 작음)</option>
            </select>
          </label>
          <button type="button" class="btn btn--primary btn--grow" id="btnSaveImage">이미지로 저장</button>
        </div>

        <div class="nav-row nav-row--end">
          <button type="button" class="btn btn--ghost" id="btnStep3Back">이전</button>
          <button type="button" class="btn btn--danger btn--outline" id="btnRestart">처음부터</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__promo">
        <a
          class="footer__logo-link"
          href="https://www.youtube.com/@gbsbfootball"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="개발새발 축구 채널 바로가기"
        >
          <img
            class="footer__logo"
            src="./assets/gbsb-channel-logo.png"
            alt="개발새발 축구"
            width="168"
            height="168"
            loading="lazy"
            decoding="async"
          />
        </a>
      </div>
      <nav class="footer__social" aria-label="개발새발 축구 채널">
        <a
          class="footer__social-link footer__social-link--yt"
          href="https://www.youtube.com/@gbsbfootball"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="개발새발 축구 YouTube 채널"
        >
          <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.7 12 3.7 12 3.7s-7.5 0-9.4.4A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 .1 12a31.5 31.5 0 0 0 .4 5.8 3 3 0 0 0 2.1 2.1c1.9.4 9.4.4 9.4.4s7.5 0 9.4-.4a3 3 0 0 0 2.1-2.1 31.5 31.5 0 0 0 .4-5.8 31.5 31.5 0 0 0-.4-5.8zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"
            />
          </svg>
          <span class="footer__social-label">YouTube</span>
        </a>
        <a
          class="footer__social-link footer__social-link--ig"
          href="https://www.instagram.com/gbsbfootball/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="개발새발 축구 Instagram"
        >
          <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 3.5A5.5 5.5 0 1 1 6.5 13 5.5 5.5 0 0 1 12 7.5zm0 2A3.5 3.5 0 1 0 15.5 13 3.5 3.5 0 0 0 12 9.5zM17.75 6a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17.75 6z"
            />
          </svg>
          <span class="footer__social-label">Instagram</span>
        </a>
      </nav>
      <p class="footer__credit">Designed by <span class="footer__brand">개발새발 축구</span></p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="./app.js?v=20260601-pc-five-line" defer></script>
</body>
</html>
